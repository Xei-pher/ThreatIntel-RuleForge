name: Bug report
description: Report a reproducible defect in RuleForge
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, confidential threat-report content, or vulnerability details here. Use private vulnerability reporting for security issues.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe set of steps needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. main @ abc1234
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, and relevant configuration with secrets removed.
